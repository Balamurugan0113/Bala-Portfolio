  <!-- Central Badge -->
  <rect x="250" y="360" width="300" height="40" rx="20" fill="rgba(245,158,11,0.12)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="400" y="385" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#FBBF24" text-anchor="middle" letter-spacing="2">LANGCHAIN • GOOGLE PaLM • MULTI-MODAL</text>
  <text x="400" y="80" font-family="'Syne', sans-serif" font-size="24" font-weight="900" fill="#FFFBEB" text-anchor="middle" letter-spacing="4">GEN AI ASSISTANT SUITE</text>
