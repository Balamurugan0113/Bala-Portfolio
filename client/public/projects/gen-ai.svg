      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0c132c"/>
      <stop offset="100%" stop-color="#030510"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow)"/>
  <g stroke="rgba(245,158,11,0.15)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Neural Nodes -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="180" x2="320" y2="140"/>
    <line x1="200" y1="180" x2="320" y2="225"/>
    <line x1="200" y1="270" x2="320" y2="225"/>
    <line x1="200" y1="270" x2="320" y2="310"/>
    <line x1="320" y1="140" x2="480" y2="180"/>
    <line x1="320" y1="225" x2="480" y2="225"/>
    <line x1="320" y1="310" x2="480" y2="270"/>
    <line x1="480" y1="180" x2="600" y2="225"/>
    <line x1="480" y1="270" x2="600" y2="225"/>
  </g>
  <!-- Node Circles -->
  <circle cx="200" cy="180" r="14" fill="#0c132c" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="200" cy="270" r="14" fill="#0c132c" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="320" cy="140" r="16" fill="#0c132c" stroke="#F97316" stroke-width="3"/>
  <circle cx="320" cy="225" r="18" fill="#F59E0B" stroke="#FFFBEB" stroke-width="3"/>
  <circle cx="320" cy="310" r="16" fill="#0c132c" stroke="#F97316" stroke-width="3"/>
  <circle cx="480" cy="180" r="16" fill="#0c132c" stroke="#F59E0B" stroke-width="3"/>
