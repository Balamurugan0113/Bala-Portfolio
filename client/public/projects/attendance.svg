<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b172b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="aglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#abg)"/>
  <circle cx="400" cy="225" r="260" fill="url(#aglow)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(59, 130, 246, 0.07)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="58" font-family="'Syne', -apple-system, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SMART ATTENDANCE &amp; GOVERNANCE ERP</text>

  <!-- Main Dashboard Preview Card -->
  <g filter="url(#shadow)">
    <rect x="110" y="95" width="580" height="235" rx="14" fill="url(#cardgrad)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.5"/>

    <!-- Window Bar -->
    <rect x="110" y="95" width="580" height="34" rx="14" fill="#0f172a" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1"/>
    <!-- Fake window buttons -->
    <circle cx="132" cy="112" r="5" fill="#EF4444"/>
    <circle cx="148" cy="112" r="5" fill="#F59E0B"/>
    <circle cx="164" cy="112" r="5" fill="#10B981"/>

    <!-- IST Timetable Lock Badge -->
    <rect x="200" y="103" width="180" height="18" rx="9" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="1"/>
    <circle cx="212" cy="112" r="3.5" fill="#10B981"/>
    <text x="224" y="115" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#38BDF8">IST SYNC: PERIOD 03 ACTIVE</text>

    <!-- RBAC 5-Tier Pill -->
    <rect x="530" y="103" width="145" height="18" rx="9" fill="rgba(139, 92, 246, 0.15)" stroke="#8B5CF6" stroke-width="1"/>
    <text x="602" y="115" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#C4B5FD" text-anchor="middle">RBAC: FACULTY PORTAL</text>

    <!-- Timetable Slots Grid -->
    <!-- Slot 1 -->
    <g transform="translate(130, 145)">
      <rect width="120" height="75" rx="8" fill="#131e33" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8">09:00 - 09:55</text>
      <text x="12" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Period 1 • AI</text>
      <rect x="12" y="52" width="62" height="14" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="43" y="62" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle">LOCKED ✓</text>
    </g>

    <!-- Slot 2 -->
    <g transform="translate(265, 145)">
      <rect width="120" height="75" rx="8" fill="#131e33" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8">09:55 - 10:50</text>
      <text x="12" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Period 2 • ML</text>
      <rect x="12" y="52" width="62" height="14" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="43" y="62" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle">LOCKED ✓</text>
    </g>

    <!-- Slot 3 (Active) -->
    <g transform="translate(400, 145)">
      <rect width="130" height="75" rx="8" fill="#1e293b" stroke="#3B82F6" stroke-width="1.8"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">11:05 - 12:00</text>
      <text x="12" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Period 3 • DBMS</text>
      <rect x="12" y="52" width="68" height="14" rx="4" fill="rgba(59, 130, 246, 0.3)"/>
      <text x="46" y="62" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#60A5FA" text-anchor="middle">● LIVE NOW</text>
    </g>

    <!-- Slot 4 (Upcoming) -->
    <g transform="translate(545, 145)">
      <rect width="125" height="75" rx="8" fill="#0d1527" stroke="rgba(100, 116, 139, 0.25)" stroke-width="1"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B">12:00 - 12:55</text>
      <text x="12" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Period 4 • Cloud</text>
      <rect x="12" y="52" width="60" height="14" rx="4" fill="rgba(100, 116, 139, 0.2)"/>
      <text x="42" y="62" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94A3B8" text-anchor="middle">UPCOMING</text>
    </g>

    <!-- NLP Quick Chat Strip & OD Badge -->
    <!-- Chat preview bubble -->
    <g transform="translate(130, 235)">
      <rect width="330" height="75" rx="8" fill="#091120" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="url(#accentCyan)"/>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">AI</text>
      <text x="42" y="27" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#38BDF8">NLP Quick-Chat Attendance</text>

      <rect x="16" y="44" width="298" height="22" rx="5" fill="#13213a"/>
      <text x="24" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#CBD5E1">&gt; &quot;Mark roll 14, 28 absent&quot;</text>
      <text x="260" y="58" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34D399">PARSED ✓</text>
    </g>

    <!-- On-Duty (OD) Protection Badge Card -->
    <g transform="translate(475, 235)">
      <rect width="195" height="75" rx="8" fill="#091120" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FBBF24">🛡️ OD Governance</text>
      <text x="16" y="44" font-family="-apple-system, sans-serif" font-size="10.5" fill="#CBD5E1">Symposium (Roll 07, 19)</text>
      <rect x="16" y="52" width="130" height="15" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="81" y="63" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FBBF24" text-anchor="middle">AUTO-PROTECTED (OD)</text>
    </g>
  </g>

  <!-- Bottom Technology Pill -->
  <rect x="210" y="360" width="380" height="40" rx="20" fill="rgba(59,130,246,0.12)" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="400" y="385" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#93C5FD" text-anchor="middle" letter-spacing="2">FASTAPI • REACT 18 • IST TIMETABLE SYNC</text>
</svg>
