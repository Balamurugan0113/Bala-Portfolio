<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0305"/>
      <stop offset="50%" stop-color="#220710"/>
      <stop offset="100%" stop-color="#080204"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cbg)"/>
  <circle cx="400" cy="225" r="220" fill="url(#cglow)"/>
  <!-- ECG Grid -->
  <g stroke="rgba(239,68,68,0.12)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="175" x2="800" y2="175"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="325" x2="800" y2="325"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>
  <!-- ECG Pulse Wave -->
  <path d="M 50 225 L 220 225 L 250 200 L 275 250 L 310 110 L 340 310 L 375 225 L 430 225 L 460 200 L 485 240 L 520 120 L 550 300 L 580 225 L 750 225" 
    stroke="#EF4444" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Heart Icon Center -->
  <path d="M 400 185 C 380 150, 320 160, 320 205 C 320 245, 400 285, 400 285 C 400 285, 480 245, 480 205 C 480 160, 420 150, 400 185 Z"
    fill="rgba(239,68,68,0.25)" stroke="#F43F5E" stroke-width="2.5"/>
  <rect x="230" y="360" width="340" height="40" rx="20" fill="rgba(239,68,68,0.15)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="400" y="385" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#FCA5A5" text-anchor="middle" letter-spacing="2">SCIKIT-LEARN • BIOMETRIC PREDICTION • EDA</text>
  <text x="400" y="70" font-family="'Syne', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HEART DISEASE PREDICTION ML</text>
</svg>