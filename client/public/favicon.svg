<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#1A1A24"/>
      <stop offset="0.6" stop-color="#0C0C13"/>
      <stop offset="1" stop-color="#060609"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.45" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded plate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="5" y="5" width="502" height="502" rx="108" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- B monogram: stem + two bowls -->
  <g filter="url(#softGlow)">
    <!-- stem -->
    <rect x="164" y="118" width="70" height="276" rx="35" fill="url(#gold)"/>
    <!-- upper bowl -->
    <path d="M196 118 h102 a69 69 0 0 1 0 138 H196 z" fill="url(#gold)"/>
    <!-- lower bowl -->
    <path d="M196 256 h126 a69 69 0 0 1 0 138 H196 z" fill="url(#gold)"/>
    <!-- circuit pins (techno accents) -->
    <rect x="132" y="134" width="58" height="26" rx="13" fill="url(#gold)"/>
    <rect x="132" y="352" width="58" height="26" rx="13" fill="url(#gold)"/>
  </g>

  <!-- AI node: cyan circuit trace + node -->
  <circle cx="366" cy="325" r="10" fill="#22D3EE"/>
  <circle cx="366" cy="325" r="19" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="4"/>
</svg>
